# Options for the Spotify Connect receiver (librespot).
# Restart the add-on / container after changing anything here.

# Name shown in Spotify's device picker.
LIBRESPOT_NAME="Home Assistant"

# Any extra librespot flags. See `librespot --help` or
# https://github.com/librespot-org/librespot
LIBRESPOT_OPTS="--bitrate 320 --enable-volume-normalisation --initial-volume 100"
