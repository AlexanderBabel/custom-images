# Options for the Spotify Connect receiver (librespot).
# Restart the add-on / container after changing anything here.

# Name shown in Spotify's device picker.
LIBRESPOT_NAME="Home Assistant"

# Any extra librespot flags. See `librespot --help` or
# https://github.com/librespot-org/librespot
LIBRESPOT_OPTS="--bitrate 320 --enable-volume-normalisation --initial-volume 100"

# Useful flags for LIBRESPOT_OPTS:
#
#   --bitrate 320                  audio quality {96|160|320}, 320 needs Premium
#   --autoplay on                  keep playing similar songs when the queue ends
#   --device-type avr              icon Spotify shows {speaker|avr|tv|computer|...}
#   --initial-volume 60            volume in % right after a start
#   --enable-volume-normalisation  play everything at a similar loudness
#   --normalisation-pregain 3.0    ... and lift it again, it lowers the volume
#   --disable-audio-cache          keep played tracks out of /config
#   --zeroconf-port 4070           fixed port, e.g. for a restrictive firewall
#   --quiet                        only warnings and errors in the add-on log

# Who is logged in
# ----------------
# There is nothing to configure. Spotify dropped username/password logins, so
# the way in is the device list: open Spotify anywhere in the same network and
# pick "Home Assistant". The account you picked it from is remembered in
# /config/owntone/librespot, which is what keeps the speaker visible to that
# account afterwards, also from outside the house.
#
# To hand the speaker to a different account, stop the add-on, delete
# /config/owntone/librespot and pair again from that account.

# Volume
# ------
# By default the volume slider in Spotify is passed on to OwnTone, which sets it
# on the speaker itself - that reacts immediately. Uncomment to let librespot do
# the volume in software instead, at the price of a few seconds of delay.
#
#LIBRESPOT_VOLUME_OPTS="--volume-ctrl log --volume-range 60"
