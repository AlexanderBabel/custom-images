# HomePod Connect defaults. Anything not set here keeps OwnTone's own default,
# the fully commented reference config ships in the image at
# /usr/share/doc/owntone/examples/owntone.conf and is documented at
# https://owntone.github.io/owntone-server/configuration/

general {
	# linuxserver/daapd used to run OwnTone as this user, kept so existing
	# installs keep access to their database.
	uid = "abc"

	db_path = "/config/owntone/dbase_and_logs/songs3.db"
	cache_dir = "/config/owntone/dbase_and_logs"

	# Straight into the add-on log tab. A handful of startup lines show up
	# twice because OwnTone also mirrors those to the console.
	logfile = "/dev/stderr"
	loglevel = log

	admin_password = "owntoneadmin8765"
	websocket_port = 3688

	trusted_networks = { "localhost", "192.168", "172.17", "172.30" }
	ipv6 = no
}

library {
	name = "Home Assistant Music"
	port = 3689

	# /music holds the Spotify pipe, /media is the Home Assistant media folder.
	directories = { "/music", "/media" }

	# Start playing as soon as librespot writes into /music/Spotify.
	pipe_autostart = true
}

# No sound card in the container, everything is sent to AirPlay speakers.
audio {
	nickname = "None"
	type = "disabled"
}

airplay_shared {
	control_port = 3690
	timing_port = 3691
}

mpd {
	port = 0
}

streaming {
	sample_rate = 48000
	bit_rate = 320
}
