name: Build Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      files: "${{ steps.extract.outputs.files }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            changed:
              - "**/Dockerfile"

      - name: Format output
        id: extract
        run: |
          files=$(printf '%s\n' ${{ steps.filter.outputs.changed_files }} | \
            sed 's|/.*$||' | \
            awk '!a[$0]++' | \
            jq -nRc '[inputs | select(length>0)]')
          echo "files=${files}" >> $GITHUB_OUTPUT

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest

    if: ${{ needs.changes.outputs.files != '[]' }}

    needs:
      - changes

    strategy:
      matrix:
        file: ${{ fromJson(needs.changes.outputs.files) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Retrieve version and revision
        id: version
        run: |
          VERSION=$(sed -nr 's/^FROM .*:(.*)/\1/p' ${{ matrix.file }}/Dockerfile | tail -n 1)

          TAGS_JSON=$(curl -sf \
            -u "${{ github.actor }}:${{ github.token }}" \
            "https://ghcr.io/v2/alexanderbabel/${{ matrix.file }}/tags/list" \
            2>/dev/null || echo '{"tags":[]}')

          MAX_REV=$(echo "$TAGS_JSON" | jq -r --arg prefix "${VERSION}-" \
            '[.tags[]? | select(startswith($prefix)) | ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber] | max // 0')

          REVISION=$(( MAX_REV + 1 ))

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}-${REVISION}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alexanderbabel/${{ matrix.file }}
          tags: |
            ${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.version }}
            latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
